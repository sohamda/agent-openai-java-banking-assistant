name: SBOM Generation and License Compliance

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-maven:
    name: Maven SBOM & License Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - path: app/copilot
            name: copilot
            cyclonedx-goal: makeAggregateBom
          - path: app/business-api/account
            name: account-api
            cyclonedx-goal: makeBom
          - path: app/business-api/payment
            name: payment-api
            cyclonedx-goal: makeBom
          - path: app/business-api/transactions-history
            name: transactions-history-api
            cyclonedx-goal: makeBom
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM and check licenses for ${{ matrix.module.name }}
        run: |
          cd ${{ matrix.module.path }}
          mvn --batch-mode package cyclonedx:${{ matrix.module.cyclonedx-goal }} license:aggregate-add-third-party -DskipTests

      - name: Upload SBOM artifact for ${{ matrix.module.name }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.module.name }}
          path: ${{ matrix.module.path }}/target/bom.*
          if-no-files-found: warn

  sbom-frontend:
    name: Frontend npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Run npm audit
        working-directory: app/frontend
        run: npm audit --audit-level=moderate

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: app/frontend
          artifact-name: sbom-frontend.spdx.json
          output-file: /tmp/sbom-frontend.spdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: /tmp/sbom-frontend.spdx.json
          if-no-files-found: warn
