apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend-deployment
    namespace: azure-open-ai
    labels:
        app: frontend
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: frontend
                  image: {{.Env.SERVICE_FRONTEND_IMAGE_NAME}}
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 80
                  envFrom:
                      - configMapRef:
                            name: azd-env-configmap
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  resources:
                      requests:
                          cpu: "100m"
                          memory: "128Mi"
                      limits:
                          cpu: "500m"
                          memory: "256Mi"
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      - name: nginx-cache
                        mountPath: /var/cache/nginx
                      - name: nginx-run
                        mountPath: /var/run
            volumes:
                - name: tmp
                  emptyDir: {}
                - name: nginx-cache
                  emptyDir: {}
                - name: nginx-run
                  emptyDir: {}
