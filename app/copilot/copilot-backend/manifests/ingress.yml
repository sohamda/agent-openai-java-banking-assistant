apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-api
  namespace: azure-open-ai
# annotations: 
#   nginx.ingress.kubernetes.io/use-regex: "true"
#   nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    # Replace <INGRESS_HOST> with your cluster hostname and pre-create the
    # banking-tls Secret (type: kubernetes.io/tls) in the azure-open-ai namespace
    # before applying this manifest.
    - hosts:
        - <INGRESS_HOST>
      secretName: banking-tls
  rules:
    - host: <INGRESS_HOST>
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80